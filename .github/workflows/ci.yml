name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  backend:
    name: Backend (fmt, clippy, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_commerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_commerce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/erp_commerce
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      JWT_TTL_SECONDS: 3600
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_BUCKET: erp-commerce-ci
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      SIGNED_URL_TTL_SECONDS: 900
      SIGNED_UPLOAD_TTL_SECONDS: 300

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Run migrations
        run: sqlx migrate run

      - name: Test
        run: cargo test --all-features

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    # The frontend does not exist yet; this job turns on once frontend/ lands.
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: erp-commerce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
